<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Análise de Representatividade</title>
  <style>
    body {
      width: 350px;
      font-family: sans-serif;
    }
    #chart-container {
      padding: 10px;
    }
    /* Estilos para a nova seção */
    #nomes-encontrados-container {
      padding: 0 10px 10px 10px;
      border-top: 1px solid #f0f0f0;
      border-bottom: 1px solid #f0f0f0;
    }
    #nomes-encontrados-container h3 {
      font-size: 14px;
      margin-top: 10px;
      margin-bottom: 5px;
    }
    #nomes-encontrados-container p {
      margin-top: 5px;
      font-size: 13px;
      color: #333;
    }
    #sugestoes-container {
      padding: 0 10px 10px 10px;
    }
    #sugestoes-container h2 {
      font-size: 14px;
      margin-top: 10px;
    }
    #sugestoes-container a {
      display: block;
      margin-top: 8px;
      text-decoration: none;
      color: #2980b9;
    }
    #sugestoes-container a:hover {
      text-decoration: underline;
    }

    /* --- Estilos do Interruptor --- */
    #switch-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background-color: #f9f9f9;
      border-bottom: 1px solid #f0f0f0;
    }
    #switch-container span {
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 28px;
    }
    .switch input {
      display: none;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.4s;
      border-radius: 28px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: 0.4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #2980b9;
    }
    input:checked + .slider:before {
      transform: translateX(22px);
    }
  </style>
</head>
<body>
  <!-- O INTERRUPTOR VEM PRIMEIRO -->
  <div id="switch-container">
    <span>Extensão Ativada/Desativada</span>
    <label class="switch">
      <input type="checkbox" id="toggle-switch" />
      <span class="slider"></span>
    </label>
  </div>

  <!-- O RESTO DO CONTEÚDO VEM DEPOIS -->
  <div id="chart-container">
    <canvas id="meuGrafico"></canvas>
  </div>

  <div id="nomes-encontrados-container"></div>

  <div id="sugestoes-container"></div>

  <div id="mensagem"></div>

  <script src="chart.umd.js"></script>
  <script src="popup.js"></script>
</body>
</html>
